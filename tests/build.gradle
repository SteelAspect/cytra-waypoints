plugins {
	id 'net.fabricmc.fabric-loom-remap'
}

// Tests only, never released. The mod itself (one jar for the server and players) is built by :server.
//  - runInstalledServerTest:  the built jar on a production dedicated server (Fabric API only, no Xaero's Minimap).
// 1.20.4: the client tests (Xaero sync game test, installed-client test) need fabric-client-gametest-api-v1, which
// starts at 1.21.4; ../smoketest.sh covers a client joining a dedicated server instead.

repositories {
	mavenCentral()
	mavenLocal {
		content { includeModule "dev.steelaspect", "alloy-ui" }
	}
	// CI (no mavenLocal): GitHub Packages, read with the ALLOY_PACKAGES_TOKEN secret (alloy-ui DESIGN.md §8).
	maven {
		url = "https://maven.pkg.github.com/SteelAspect/alloy-ui"
		credentials {
			username = System.getenv("GITHUB_ACTOR") ?: findProperty("gpr.user") ?: "SteelAspect"
			password = System.getenv("ALLOY_PACKAGES_TOKEN") ?: findProperty("gpr.key") ?: ""
		}
		content { includeModule "dev.steelaspect", "alloy-ui" }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

evaluationDependsOn(':server')
def serverProject = project(':server')

// Nothing here is a mod of its own: no jar to build or publish.
tasks.named("jar") { enabled = false }
tasks.named("remapJar") { enabled = false }

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

// Server install test: a production dedicated server whose mods folder holds the same built jar and Fabric API, and
// nothing else (no Xaero's Minimap). A tiny test mod checks Alloy Waypoints loaded and /cway exists once the server
// has started, then stops the server. Proves the one jar needs nothing client-side on a server.
// Run with `./gradlew :tests:runInstalledServerTest` (no display needed).
sourceSets {
	servertest {
		compileClasspath += main.compileClasspath
	}
}

def serverTestJar = tasks.register("serverTestJar", Jar) {
	from sourceSets.servertest.output
	archiveClassifier = "servertest-named"
	destinationDirectory = layout.buildDirectory.dir("servertest")
}

def remapServerTestJar = tasks.register("remapServerTestJar", net.fabricmc.loom.task.RemapJarTask) {
	inputFile = serverTestJar.flatMap { it.archiveFile }
	archiveClassifier = "servertest"
	destinationDirectory = layout.buildDirectory.dir("servertest")
	addNestedDependencies = false
}

configurations {
	installedServerMods {
		transitive = false
	}
}

dependencies {
	installedServerMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

tasks.register("runInstalledServerTest", net.fabricmc.loom.task.prod.ServerProductionRunTask) {
	description = "Runs the built Alloy Waypoints jar on a production dedicated server, like a server's mods folder."
	mods.from(serverProject.tasks.named("remapJar"))
	mods.from(configurations.installedServerMods)
	mods.from(remapServerTestJar)
	programArgs.add("nogui")
	def runDirectory = layout.buildDirectory.dir("installedserver")
	runDir = runDirectory
	doFirst {
		def dir = runDirectory.get().asFile
		["world", "config", "mods", "logs"].each { new File(dir, it).deleteDir() }
		dir.mkdirs()
		new File(dir, "eula.txt").text = "eula=true\n"
		// Small and quick: no structures, a short view distance, an unusual port.
		new File(dir, "server.properties").text = "generate-structures=false\nserver-port=25570\n" +
				"online-mode=false\nspawn-protection=0\nview-distance=3\nsimulation-distance=3\n"
	}
}
