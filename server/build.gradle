plugins {
	id 'net.fabricmc.fabric-loom-remap'
	id 'com.modrinth.minotaur'
}

def modVersion = project.ext.modVersion

base {
	// One jar for the server and players.
	archivesName = project.ext.isRelease ? "alloy-waypoints" : "alloy-waypoints-dev"
}

repositories {
	// Alloy UI (the shared Nocturne look), from the local Maven repo: ./gradlew publishToMavenLocal in alloy-ui.
	mavenLocal {
		content { includeModule "dev.steelaspect", "alloy-ui" }
	}
	// CI (no mavenLocal): GitHub Packages, read with the ALLOY_PACKAGES_TOKEN secret (alloy-ui DESIGN.md §8).
	maven {
		url = "https://maven.pkg.github.com/SteelAspect/alloy-ui"
		credentials {
			username = System.getenv("GITHUB_ACTOR") ?: findProperty("gpr.user") ?: "SteelAspect"
			password = System.getenv("ALLOY_PACKAGES_TOKEN") ?: findProperty("gpr.key") ?: ""
		}
		content { includeModule "dev.steelaspect", "alloy-ui" }
	}
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/releases/"
		content { includeGroup "com.terraformersmc" }
	}
	// fabric-permissions-api and squaremap-api are published to Maven Central.
	mavenCentral {
		content { excludeGroup "de.bluecolored" }
	}
	maven {
		name = "BlueMap"
		url = "https://repo.bluecolored.de/releases"
		content { includeGroup "de.bluecolored" }
	}
	// Only for the GameTest server (squaremap), never for the released jar.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter { includeGroup "maven.modrinth" }
	}
}

sourceSets {
	// Headless-server integration tests (Fabric GameTest, run with `./gradlew runGametest`).
	// Kept in their own source set so they never end up in the released jar.
	gametest {
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
	}
}

loom {
	// src/main is common (everything the server needs); src/client is the menu and the Xaero's Minimap sync, only
	// loaded on players' games.
	splitEnvironmentSourceSets()

	mods {
		"sharedwaypoints" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		"sharedwaypoints-gametest" {
			sourceSet sourceSets.gametest
		}
	}

	runs {
		gametest {
			server()
			name = "Game Test"
			// Runs the tests on a throwaway headless server, then exits (non-zero on failure).
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.file('gametest/report.xml').get().asFile}"
			runDir "build/gametest"
			source sourceSets.gametest
		}
	}
}

// No client game tests on 1.20.4 (fabric-client-gametest-api-v1 starts at 1.21.4). Instead src/smoketest is a small
// client mod run by ../smoketest.sh (through ../headless.sh): it joins a dedicated 1.20.4 server running the built jar,
// checks the waypoint sync and WaypointsApi, opens every menu screen and logs [WaypointsSmoke] PASS/FAIL.
sourceSets {
	smoketest {
		compileClasspath += main.compileClasspath + main.output + client.compileClasspath + client.output
		runtimeClasspath += main.runtimeClasspath + main.output + client.runtimeClasspath + client.output
	}
}

loom {
	mods {
		"sharedwaypoints-smoke" {
			sourceSet sourceSets.smoketest
		}
	}
	runs {
		smokeTest {
			client()
			name = "Smoke test"
			runDir "build/run/smoke"
			source sourceSets.smoketest
			vmArg "-Dsharedwaypoints.smoke=true"
			ideConfigGenerated false
		}
	}
}

configurations {
	// -PwithXaero: Xaero's Minimap in the smoke client's mods/ folder (Fabric Loader remaps it at runtime), to check
	// the Xaero sync for real. Modrinth version QU2hvkUg = xaerominimap-fabric-1.20.4-26.6.0.
	smokeClientMods {
		transitive = false
	}
}

dependencies {
	smokeClientMods "maven.modrinth:xaeros-minimap:${project.xaero_minimap_modrinth_version}"
}

def copySmokeClientMods = tasks.register("copySmokeClientMods", Sync) {
	from(project.hasProperty("withXaero") ? configurations.smokeClientMods : files())
	into layout.buildDirectory.dir("run/smoke/mods")
}

tasks.matching { it.name == "runSmokeTest" }.configureEach {
	dependsOn copySmokeClientMods
	// Fresh config and Xaero data every run; test clients run muted.
	def runDirectory = project.layout.buildDirectory.dir("run/smoke")
	doFirst {
		new File(runDirectory.get().asFile, "config/sharedwaypoints").deleteDir()
		new File(runDirectory.get().asFile, "xaero").deleteDir()
		def options = new File(runDirectory.get().asFile, "options.txt")
		options.parentFile.mkdirs()
		def lines = options.exists() ? options.readLines().findAll { !it.startsWith("soundCategory_master:") } : []
		options.text = (lines + "soundCategory_master:0.0").join("\n") + "\n"
	}
}

configurations {
	// Mod jars dropped unchanged into the GameTest server's mods/ folder, like a server owner would install them.
	// Fabric Loader remaps them at runtime and loads the libraries they bundle.
	gametestServerMods {
		transitive = false
	}
}

def copyGametestMods = tasks.register("copyGametestMods", Sync) {
	from configurations.gametestServerMods
	into layout.buildDirectory.dir("gametest/mods")
}

tasks.named("runGametest") {
	dependsOn copyGametestMods
	// Start every run from an empty waypoint list.
	def waypointConfig = project.layout.buildDirectory.dir("gametest/config/sharedwaypoints")
	doFirst {
		waypointConfig.get().asFile.deleteDir()
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Official Mojang mappings (Yarn is not maintained past 1.21.11).
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Permissions API, bundled (jar-in-jar) so server owners don't need to install it separately.
	// Without a permissions provider (e.g. LuckPerms) it falls back to vanilla op levels.
	modImplementation "me.lucko:fabric-permissions-api:${project.permissions_api_version}"
	include "me.lucko:fabric-permissions-api:${project.permissions_api_version}"

	// Optional web-map integrations: compiled against, never bundled. Used only when the server has them.
	// The BlueMap API (2.7, BlueMap 5.x) is published for Java 21; it's only interfaces, compiled against here and called
	// only when BlueMap is installed (BlueMap 5 needs a Java 21 server anyway).
	compileOnly("de.bluecolored:bluemap-api:${project.bluemap_api_version}") {
		attributes { attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 21) }
	}
	compileOnly "xyz.jpenilla:squaremap-api:${project.squaremap_api_version}"

	// The GameTest server also runs squaremap 1.3.12, to check the web-map layer for real (see copyGametestMods).
	gametestServerMods "maven.modrinth:squaremap:${project.squaremap_modrinth_version}"

	// Alloy UI: the menu's look and widgets (client code only), bundled (jar-in-jar).
	modImplementation "dev.steelaspect:alloy-ui:${project.alloyui_version}"
	include "dev.steelaspect:alloy-ui:${project.alloyui_version}"
	// Mod Menu: optional, only for the settings button there.
	// 9.2.0 (1.20.4) pulls a placeholder-api build no repo serves, so no transitive dependencies.
	modCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }

	// The sync messages. Bundled (jar-in-jar).
	implementation project(path: ':protocol', configuration: 'namedElements')
	include project(':protocol')

	// JUnit 5 running inside Fabric Loader, so tests can use Minecraft classes.
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testImplementation "org.junit.jupiter:junit-jupiter-params:5.10.0"
}

sourceSets {
	// Unit tests also cover the client-only code (the Xaero sync's state and Xaero lookups).
	test {
		compileClasspath += client.compileClasspath + client.output
		runtimeClasspath += client.runtimeClasspath + client.output
	}
}

test {
	useJUnitPlatform()
}

processResources {
	def version = modVersion
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

jar {
	from(rootProject.file("LICENSE")) {
		rename { "${it}_alloy-waypoints" }
	}
}

// The README's download badge and the changelog are written by hand; fail the build if they miss a version bump.
def checkDocs = tasks.register("checkDocs") {
	// The docs name the base version; the 1.20.4 port's "+1.20.4" suffix isn't repeated there.
	def version = project.version.toString() - "+1.20.4"
	def readme = rootProject.file("README.md")
	def changelog = rootProject.file("CHANGELOG.md")
	inputs.property "version", version
	inputs.files readme, changelog
	doLast {
		if (!readme.text.contains("badge/download-${version}-")) {
			throw new GradleException("README.md: the download badge doesn't say ${version} (mod_version)")
		}
		if (!changelog.readLines().any { it == "## ${version}" || it.startsWith("## ${version} ") }) {
			throw new GradleException("CHANGELOG.md has no '## ${version}' section")
		}
	}
}

tasks.named("check") {
	dependsOn checkDocs
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

// Modrinth upload: `./gradlew :server:modrinth` with the MODRINTH_TOKEN environment variable set (a Modrinth token
// with the CREATE_VERSION scope). Release builds only (the main branch, or -Prelease=true), so a dev jar can never
// be uploaded. The changelog is this version's section of CHANGELOG.md; add -PmodrinthDryRun to print the upload
// without sending it. Fails if this version number is already on Modrinth.
def changelogSection = { String version ->
	def lines = rootProject.file("CHANGELOG.md").readLines()
	def start = lines.findIndexOf { it == "## ${version}" || it.startsWith("## ${version} ") }
	if (start < 0) return "Alloy Waypoints ${version}"
	def end = lines.findIndexOf(start + 1) { it.startsWith("## ") }
	return lines.subList(start + 1, end < 0 ? lines.size() : end).join("\n").trim()
}

modrinth {
	projectId = rootProject.modrinth_project
	versionNumber = modVersion
	versionName = "Alloy Waypoints ${modVersion}"
	uploadFile = remapJar
	gameVersions = [rootProject.minecraft_version]
	loaders = ["fabric"]
	changelog = changelogSection(rootProject.mod_version)
	debugMode = project.hasProperty("modrinthDryRun")
	dependencies {
		required.project "fabric-api"
		// Optional integrations, used only when installed.
		optional.project "bluemap"
		optional.project "squaremap"
		optional.project "xaeros-minimap"
	}
}

tasks.named("modrinth") {
	def release = project.ext.isRelease
	doFirst {
		if (!release) {
			throw new GradleException("Only release builds go to Modrinth: build from main, or pass -Prelease=true")
		}
	}
}
