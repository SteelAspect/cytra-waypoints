pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'sharedwaypoints'

// protocol:   the sync messages (a small library bundled inside the mod jar)
// server:     the mod: one jar for the server and players (commands, chat buttons, routes, web maps, sync sender;
//             on players' games also the menu and the Xaero's Minimap sync). Builds sharedwaypoints-<version>.jar
// tests:      tests only, never released: the Xaero sync in a real game with Xaero's Minimap, and the built jar
//             installed like a player's mods folder and like a server's
include 'protocol', 'server', 'tests'
