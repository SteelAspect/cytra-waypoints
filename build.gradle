plugins {
	// 1.21.11 is the last obfuscated Minecraft release, so it needs the remapping flavour of Loom.
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
	id 'com.modrinth.minotaur' version '2.10.0' apply false
}

// Release vs. test builds. Builds from the `main` branch are releases (cytra-waypoints-<version>.jar);
// builds from any other branch, e.g. `dev`, are test builds (cytra-waypoints-dev-<version>.jar, version
// "<version>+dev" in-game), so the two can never be mixed up. Force either with -Prelease=true / -Prelease=false.
def gitBranch = ''
try {
	gitBranch = providers.exec {
		commandLine 'git', 'rev-parse', '--abbrev-ref', 'HEAD'
		ignoreExitValue = true
	}.standardOutput.asText.get().trim()
} catch (Exception ignored) {
	// No git (e.g. building from a source zip): treated as a test build unless -Prelease=true.
}
if (gitBranch == 'HEAD') {
	// Detached checkout (typical in CI): use the CI's branch name if it has one.
	gitBranch = providers.environmentVariable('GITHUB_REF_NAME').getOrElse('')
}
def isRelease = project.hasProperty('release') ? project.property('release').toString().toBoolean() : gitBranch == 'main'

subprojects {
	version = rootProject.mod_version
	group = rootProject.maven_group
	ext.isRelease = isRelease
	ext.modVersion = isRelease ? rootProject.mod_version : "${rootProject.mod_version}+dev"

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 21
		it.options.encoding = "UTF-8"
	}
}
