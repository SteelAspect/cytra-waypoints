name: Release

# Three ways to release version X.Y.Z (mod_version in gradle.properties must match):
#   - push a tag vX.Y.Z               -> this creates the GitHub release with the jars attached
#   - publish a release on GitHub     -> this builds the jars and attaches them to that release
#   - Actions -> Release -> Run workflow with tag vX.Y.Z (and optionally a commit, default: the branch's latest)
#                                     -> this creates the tag and the release with the jars attached
# Every way the jar is built from the released commit and has passed the unit tests, the GameTest and the
# dedicated-server install test.
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create, e.g. v1.4.0 (must match mod_version)'
        required: true
      commit:
        description: 'Commit to release (default: the latest commit of the chosen branch)'
        required: false

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit || (github.event_name == 'workflow_dispatch' && github.sha) || env.TAG }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches mod_version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match mod_version=$version in gradle.properties"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build, unit tests, headless-server GameTest and the dedicated-server install test
        run: ./gradlew build runGametest :tests:runInstalledServerTest -Prelease=true --stacktrace

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" 'index($0, "## " v " ") == 1 || $0 == "## " v {found=1; next} /^## / && found {exit} found' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "Cytra Waypoints $VERSION" > release-notes.md
          cat release-notes.md

      - name: Publish the jars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One jar, for the server and for players.
          jars="server/build/libs/cytra-waypoints-$VERSION.jar"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" $jars --clobber
            # A release written by hand with no notes gets the changelog section.
            if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
              gh release edit "$TAG" --notes-file release-notes.md
            fi
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # Creates the tag on the checked-out commit.
            gh release create "$TAG" $jars --target "$(git rev-parse HEAD)" --title "Cytra Waypoints $VERSION" --notes-file release-notes.md
          else
            gh release create "$TAG" $jars --title "Cytra Waypoints $VERSION" --notes-file release-notes.md --verify-tag
          fi
