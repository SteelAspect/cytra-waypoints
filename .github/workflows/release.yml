name: Release

# Push a tag like v1.2.0 to build, test and publish a GitHub release with the jar attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches mod_version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mod_version=$version in gradle.properties"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build, unit tests and headless-server GameTest
        run: ./gradlew build runGametest -Prelease=true --stacktrace

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" 'index($0, "## " v " ") == 1 || $0 == "## " v {found=1; next} /^## / && found {exit} found' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "SharedWaypoints $VERSION" > release-notes.md
          cat release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/libs/sharedwaypoints-$VERSION.jar" \
            --title "SharedWaypoints $VERSION" \
            --notes-file release-notes.md \
            --verify-tag
