name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, unit tests and headless-server GameTest
        run: ./gradlew build runGametest --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: sharedwaypoints-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error

  client:
    # Real Minecraft client (software OpenGL under Xvfb): opens the menu, adds/edits waypoints, saves screenshots.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install a virtual display and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri

      - name: Client GameTest
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew --no-daemon runClientGametest --stacktrace

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-screenshots-${{ github.sha }}
          path: build/clientgametest/screenshots/
          if-no-files-found: ignore
