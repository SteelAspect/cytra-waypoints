name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, unit tests and headless-server GameTest
        run: ./gradlew build runGametest --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: sharedwaypoints-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
