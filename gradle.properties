# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric (versions checked against meta.fabricmc.net / maven.fabricmc.net)
# Loom 1.17.x is the newest line that still runs on a Java 21 JVM (1.18+ needs Java 25).
minecraft_version=1.21.11
loader_version=0.19.5
loom_version=1.17.21
fabric_api_version=0.141.6+1.21.11

# Mod
mod_version=1.4.0
maven_group=io.github.steelaspect.sharedwaypoints
archives_base_name=sharedwaypoints

# Dependencies
# 0.6.x is the fabric-permissions-api line for 1.21.11 (0.7.0 targets 26.1)
permissions_api_version=0.6.1
# Optional web maps (compile-only). Checked against BlueMap 5.16 and squaremap 1.3.12 for 1.21.11.
bluemap_api_version=2.7.4
squaremap_api_version=1.3.12
# squaremap 1.3.12 for 1.21.11 on Modrinth, used only by the GameTest server
squaremap_modrinth_version=BW8lMXBi
