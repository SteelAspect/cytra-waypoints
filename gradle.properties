# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric (versions checked against meta.fabricmc.net / maven.fabricmc.net)
# Loom 1.17.x is the newest line that still runs on a Java 21 JVM (1.18+ needs Java 25).
minecraft_version=1.20.4
loader_version=0.19.5
loom_version=1.17.21
fabric_api_version=0.97.3+1.20.4

# Mod
# 1.20.4 port (branch mc1.20.4, see ../PORTING.md): the same features as 2.10.0 for 1.21.11
mod_version=2.10.0+1.20.4
maven_group=io.github.steelaspect.sharedwaypoints
# Jar name: alloy-waypoints-<version>.jar, here alloy-waypoints-2.10.0+1.20.4.jar (one jar for the server and players)

# Dependencies
# 0.3.1 is the fabric-permissions-api line that works on 1.20.4
permissions_api_version=0.3.1
# Alloy UI, the shared Nocturne look (jar-in-jar; publishToMavenLocal in ~/Documents/Mods/alloy-ui first)
alloyui_version=1.4.0+1.20.4
# Mod Menu, compile-only (settings button)
modmenu_version=9.2.0
# Optional web maps (compile-only). BlueMap API 2.7.4 and squaremap 1.2.3 (the 1.20.4 build).
bluemap_api_version=2.7.4
squaremap_api_version=1.2.3
# squaremap 1.2.3 for 1.20.4 on Modrinth, used only by the GameTest server
squaremap_modrinth_version=993nc3aP
# Xaero's Minimap for the smoke test's -PwithXaero run (runtime only, never bundled). Modrinth version QU2hvkUg is
# xaerominimap-fabric-1.20.4-26.6.0, the 1.20.4 build of the line the Xaero sync was built against (26.5.0 on 1.21.11).
xaero_minimap_modrinth_version=QU2hvkUg

# Modrinth project slug or id (see the modrinth block in server/build.gradle)
modrinth_project=sharedwaypoints
