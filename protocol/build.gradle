plugins {
	id 'net.fabricmc.fabric-loom-remap'
}

// The sync messages spoken by sharedwaypoints-server and sharedwaypoints-client. Never installed on its own:
// both mods bundle it (jar-in-jar), and Fabric loads a single copy when both are present.
base {
	archivesName = "sharedwaypoints-protocol"
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.ext.modVersion
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
