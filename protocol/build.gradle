plugins {
	id 'net.fabricmc.fabric-loom-remap'
}

// The sync messages between the server and players' games. Never installed on its own:
// the mod bundles it (jar-in-jar). Kept separate so the message format lives in one small place.
base {
	archivesName = "sharedwaypoints-protocol"
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.ext.modVersion
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
