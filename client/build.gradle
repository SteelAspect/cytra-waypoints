plugins {
	id 'net.fabricmc.fabric-loom-remap'
}

// The optional client mod: mirrors the server's shared waypoints into Xaero's Minimap ("Shared" waypoint set).
base {
	archivesName = project.ext.isRelease ? "sharedwaypoints-client" : "sharedwaypoints-client-dev"
}

repositories {
	mavenCentral()
	// Xaero's Minimap, only at runtime in the client GameTest (never compiled against or bundled).
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter { includeGroup "maven.modrinth" }
	}
}

// Real-client test: singleplayer with the server mod, this mod and the real Xaero's Minimap, checking what ends up
// in Xaero's "Shared" set. Needs a display (xvfb-run in CI). Never part of the released jar.
evaluationDependsOn(':server')
def serverProject = project(':server')

sourceSets {
	clientgametest {
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
	}
}

loom {
	mods {
		"sharedwaypoints-client" {
			sourceSet sourceSets.main
		}
		// The server mod from the neighbouring project, so the singleplayer server runs it.
		"sharedwaypoints" {
			sourceSet("main", ":server")
			sourceSet("client", ":server")
		}
		"sharedwaypoints-client-gametest" {
			sourceSet sourceSets.clientgametest
		}
	}
	runs {
		clientGametest {
			client()
			name = "Client Game Test (Xaero sync)"
			vmArg "-Dfabric.client.gametest"
			runDir "build/clientgametest"
			source sourceSets.clientgametest
		}
	}
}

tasks.named("runClientGametest") {
	// Fresh config, saves and Xaero data every run.
	def runDirectory = project.layout.buildDirectory.dir("clientgametest")
	doFirst {
		["config/sharedwaypoints", "saves", "xaero"].each { new File(runDirectory.get().asFile, it).deleteDir() }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation project(path: ':protocol', configuration: 'namedElements')
	include project(':protocol')

	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"

	// Only for the client GameTest: the server mod (its classes, and its bundled permissions library) and Xaero.
	clientgametestRuntimeOnly serverProject.sourceSets.main.output
	clientgametestRuntimeOnly serverProject.sourceSets.client.output
	modLocalRuntime "me.lucko:fabric-permissions-api:${project.permissions_api_version}"
}

configurations {
	// Mod jars dropped unchanged into the test game's mods/ folder, like a player installs them. Xaero's Minimap
	// bundles XaeroLib (jar-in-jar), which only loads this way; Fabric Loader remaps the jar at runtime.
	clientTestMods {
		transitive = false
	}
}

dependencies {
	clientTestMods "maven.modrinth:xaeros-minimap:${project.xaero_minimap_modrinth_version}"
}

def copyClientTestMods = tasks.register("copyClientTestMods", Sync) {
	from configurations.clientTestMods
	into layout.buildDirectory.dir("clientgametest/mods")
}

tasks.named("runClientGametest") {
	dependsOn copyClientTestMods
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.ext.modVersion
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

jar {
	from(rootProject.file("LICENSE")) {
		rename { "${it}_sharedwaypoints-client" }
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
